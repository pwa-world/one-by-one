<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>物品辨识度检查 · 云海邮局</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f0e4;color:#665c4d;font-family:system-ui,sans-serif}h1{font-size:20px;margin:0 0 5px}p{font-size:12px;margin:0 0 14px}main{max-width:1040px}.family{display:grid;grid-template-columns:70px repeat(7,minmax(80px,1fr));gap:8px;align-items:center;margin-bottom:10px}.family h2{font-size:14px}.tile{text-align:center;font-size:11px}.tile svg{display:block;width:44px;height:44px;margin:0 auto 3px;background:#eee8d9;border-radius:6px}.tile small{display:block;color:#8a826e;font-size:10px}.tile:nth-child(2),.tile:nth-child(3){background:#e2e7d7;border-radius:8px;padding:3px 0} @media(max-width:600px){body{padding:10px}.family{grid-template-columns:45px repeat(7,72px);gap:4px}.tile svg{width:39px;height:39px}}
</style>
<h1>12 条合成链 · 84 幅独立图标</h1><p>按手机棋盘尺寸显示；绿色底为需要重点辨认的 1、2 级。仅用于本地 QA，不发布到游戏。</p><main id="gallery"></main>
<script type="module">
import {CHAINS} from '/one-by-one/data.js';
import {itemArt} from '/one-by-one/art.js';
document.querySelector('#gallery').innerHTML=Object.entries(CHAINS).map(([id,c])=>`<section class="family"><h2>${c.name}</h2>${c.names.map((name,i)=>`<div class="tile">${itemArt(id,i+1)}${name}<small>Lv.${i+1}</small></div>`).join('')}</section>`).join('');
</script></html>
