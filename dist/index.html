<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e4">
  <meta name="description" content="在云海之上经营一座小小邮局。随心合成，寄出牵挂，让远方有回音。无需体力，支持离线游玩。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>云海邮局 · 把远方，寄回身边</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./mobile.css" media="(max-width: 760px)">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="云海邮局首页"><img src="./assets/icon.svg" width="46" height="46" alt=""><span>云海邮局<small>CLOUD POST OFFICE</small></span></a>
      <div class="header-motto">每一份想念，都值得抵达。</div>
      <div class="wallet" id="wallet"></div>
      <button class="icon-button settings-trigger" data-action="settings" aria-label="设置与存档"></button>
    </header>
    <div class="intro-line"><span class="opening-note"><i class="status-dot"></i> 今日邮局，照常营业</span><span class="compact-status"><span id="mobile-space-count"></span><span id="mobile-offline-status">准备离线</span></span><span id="save-status" role="status">正在打开邮局…</span></div>
    <main class="game-layout">
      <aside class="island-panel" id="island-panel" aria-label="岛屿与建设"></aside>
      <section class="desk-panel" id="desk-panel" aria-label="合成工作台">
        <div class="desk-heading"><div><div class="eyebrow">A LITTLE MAGIC, A LITTLE MAIL</div><h1>把远方，寄回身边<span>。</span></h1></div><span class="cozy-tag">随心合成 · 无需体力</span></div>
        <div class="mobile-orders" id="mobile-orders" aria-label="居民委托，可左右滑动"></div>
        <div class="board-wrap">
          <div class="board-top"><span id="board-caption">邮局工作台</span><div><span id="space-count" class="space-count"></span><button class="icon-button" data-action="undo" id="undo-button" aria-label="撤销上一步"></button><button class="icon-button" data-action="tidy" aria-label="整理工作台"></button></div></div>
          <div id="board" class="board" role="group" aria-label="7 列 8 行合成工作台"></div>
          <div class="selection-bar" id="selection-bar"></div>
        </div>
        <div class="desk-tools" aria-label="工作台常用操作"><button data-action="undo" class="tool-button mobile-quick" id="quick-undo" aria-label="撤销上一步"></button><button data-action="storage" class="tool-button" id="storage-button"></button><button data-action="tidy" class="tool-button mobile-quick" id="quick-tidy" aria-label="整理工作台"></button><button data-action="collection" class="tool-button" id="collection-button"></button><button data-action="workshop" class="tool-button" id="workshop-button"></button></div>
        <p class="desk-hint" id="desk-hint">点击邮袋或工具箱生成物品 · 将两个相同物品合在一起</p>
      </section>
      <aside class="orders-panel" id="orders-panel" aria-label="居民委托"></aside>
    </main>
    <footer class="site-footer"><span>在云海之上，慢慢生活。</span><span id="offline-status">本机存档 · 正在准备离线资源</span><button data-action="help">新任邮局长指南</button></footer>
  </div>
  <nav class="mobile-nav" aria-label="游戏导航"><button class="active" data-action="tab" data-tab="desk">工作台</button><button data-action="tab" data-tab="island">航线</button><button data-action="journal">手帐</button><button data-action="settings">设置</button></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button class="icon-button" data-action="close" aria-label="关闭窗口"></button></div><div id="modal-body" class="modal-body"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">这座小邮局需要 JavaScript 才能营业，请在浏览器中开启 JavaScript。</div></noscript>
</body>
</html>
